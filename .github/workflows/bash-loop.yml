name: Run Bash Loop

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-loop:
    runs-on:
      - bitrise-runner-app-test-macos-m4pro-6vcpu

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run bash loop script
        run: |
          echo "Starting loop"
          for i in {1..60}
          do
            echo "Loop iteration $i"
            sleep 1
          done
          echo "Loop finished"
